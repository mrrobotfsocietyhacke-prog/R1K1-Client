name: Build R1K1 Client (Forkgram + Swap)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forkgram
        uses: actions/checkout@v4
        with:
          repository: forkgram/TelegramAndroid
          submodules: true
          fetch-depth: 1

      # ЖЕСТКИЙ ФИКС ПАМЯТИ: Создаем swap-файл на 20 ГБ
      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Сборка
      - name: Build with Gradle
        run: ./gradlew assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: R1K1-Client-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
