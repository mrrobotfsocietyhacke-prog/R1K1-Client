name: Build Telegram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем оригинальный репозиторий (с подмодулями)
      - name: Checkout Goregram
        uses: actions/checkout@v4
        with:
          repository: AmanoTeam/Goregram
          submodules: true
          fetch-depth: 1
          
      # 2. Копируем твои измененные файлы (UserConfig.java) поверх оригинала
      - name: Copy custom UserConfig
        run: |
          cp ${{ github.workspace }}/TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java /tmp/ 2>/dev/null || true
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew assembleAfatRelease
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: R1K1-Client-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
