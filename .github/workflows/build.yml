name: Build R1K1 Client

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goregram
        uses: actions/checkout@v4
        with:
          repository: AmanoTeam/Goregram
          submodules: true
          fetch-depth: 1

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install AmanoTeam GCC Toolchain
        run: |
          curl -L -o gcc.tar.xz https://github.com/AmanoTeam/android-gcc-cross/releases/latest/download/x86_64-unknown-linux-gnu.tar.xz
          mkdir -p /tmp/android-gcc-cross
          tar -xf gcc.tar.xz -C /tmp/android-gcc-cross
          echo "PINO_HOME=/tmp/android-gcc-cross" >> $GITHUB_ENV
          echo "PINO_LTO=full" >> $GITHUB_ENV
          echo "PINO_OPT_LEVEL=2" >> $GITHUB_ENV

      - name: Patch NDK to use GCC
        run: |
          /tmp/android-gcc-cross/bin/ndk-patch

      - name: Change App Name
        run: |
          sed -i 's/<string name="AppName">Goregram<\/string>/<string name="AppName">R1K1.SYS<\/string>/' TMessagesProj/src/main/res/values/strings.xml

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: ./gradlew assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: R1K1-Client-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
