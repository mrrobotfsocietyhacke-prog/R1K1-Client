name: Build R1K1 Client (Goregram)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goregram
        uses: actions/checkout@v4
        with:
          repository: AmanoTeam/Goregram
          submodules: true
          fetch-depth: 1

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      # ЖЕСТКИЙ ФИКС: Ставим GCC через системный пакетный менеджер
      - name: Install GCC and make
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make

      - name: Change App Name
        run: |
          sed -i 's/<string name="AppName">Goregram<\/string>/<string name="AppName">R1K1.SYS<\/string>/' TMessagesProj/src/main/res/values/strings.xml

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: ./gradlew assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: R1K1-Client-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
