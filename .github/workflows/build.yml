name: Build R1K1 Client (Ultimate Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forkgram
        uses: actions/checkout@v4
        with:
          repository: forkgram/TelegramAndroid
          submodules: true
          fetch-depth: 1

      # 1. Память (Swap), чтобы не упало на компиляции Java/C++
      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20

      # 2. Python 3.10 для скриптов сборки
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      # 3. Meson и Ninja (нужны для сборки dav1d, libvpx и др.)
      - name: Install meson and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build

      # 4. Rust 1.96.1 + ВСЕ таргеты
      - name: Setup Rust 1.96.1
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # 5. Жесткий фикс таргетов Rust и установка cargo-ndk
      - name: Force install Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android --toolchain stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android --toolchain 1.96.1
          cargo install cargo-ndk

      # 6. Переменные окружения для Rust
      - name: Set Rust environment variables
        run: |
          echo "RUSTUP_TOOLCHAIN=1.96.1" >> $GITHUB_ENV

      # 7. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 8. Права на gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 9. Сама сборка
      - name: Build with Gradle
        run: ./gradlew assembleAfatRelease

      # 10. Выгрузка APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: R1K1-Client-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
