name: Build R1K1 Client (Forkgram Final)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forkgram
        uses: actions/checkout@v4
        with:
          repository: forkgram/TelegramAndroid
          submodules: true
          fetch-depth: 1

      # Ставим Python, но не трогаем системный, а даем GitHub самому выбрать версию
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Собираем с флагом --stacktrace, чтобы увидеть ошибку Python, если она будет
      - name: Build with Gradle
        run: ./gradlew assembleAfatRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: R1K1-Client-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
